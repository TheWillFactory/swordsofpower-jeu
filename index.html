<style>
/* Écran de jeu plein cadre : le canvas Godot couvre tout, une couche de lancement par-dessus. */
:root {
  --night: #07060a;
  --ember: #e8743b;
  --bone: #efe6d6;
  --ash: #8b8178;
  --arm: #5fb4ff;
  --seal: #8ef08c;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--night); color: var(--bone); overflow: hidden;
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { position: fixed; inset: 0; display: block; background: var(--night); }
#canvas:focus { outline: none; }
.layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  font-family: var(--pixel); text-align: center; z-index: 5; }
#boot { background: var(--night) url("g/title_bg.png") center / cover no-repeat; image-rendering: pixelated; }
#boot::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(7,6,10,.85)); }
#boot > * { position: relative; }
#logo { width: min(70vw, 420px); image-rendering: pixelated; }
#play { font: 700 22px var(--pixel); letter-spacing: .08em; color: var(--night); background: var(--ember);
  border: 0; border-bottom: 4px solid #9c4320; padding: 12px 28px; cursor: pointer; }
#play:focus-visible { outline: 3px solid var(--arm); outline-offset: 3px; }
#play[disabled] { opacity: .6; }
#bar { width: min(60vw, 320px); height: 8px; background: rgba(239,230,214,.15); border: 1px solid var(--ash); }
#bar i { display: block; height: 100%; width: 0; background: var(--ember); transition: width .2s; }
#msg { font-size: 15px; color: var(--bone); max-width: 36ch; line-height: 1.4; }
#hint { font-size: 13px; color: var(--ash); max-width: 44ch; line-height: 1.4; }
#rotate { display: none; background: var(--night); z-index: 20; font-size: 20px; }
#rotate b { font-size: 46px; display: block; animation: turn 1.6s ease-in-out infinite; }
@keyframes turn { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
@media (prefers-reduced-motion: reduce) { #rotate b { animation: none } }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex } }
#fs { position: fixed; z-index: 6; top: calc(6px + env(safe-area-inset-top, 0px)); right: calc(6px + env(safe-area-inset-right, 0px));
  font: 12px var(--pixel); color: var(--bone); background: rgba(7,6,10,.55); border: 1px solid var(--ash); padding: 4px 8px; opacity: .55; }
</style>

<canvas id="canvas" tabindex="0"></canvas>

<div id="boot" class="layer">
  <img id="logo" src="g/logo.png" alt="Swords of Power">
  <div id="bar"><i></i></div>
  <div id="msg">Chargement de la forge…</div>
  <button id="play" type="button" hidden>Toucher pour jouer</button>
  <div id="hint">Joue en paysage, son activé. Commandes tactiles à l'écran.<span id="a2hs" hidden><br>Plein écran : Partager ▸ « Sur l'écran d'accueil », puis lance le jeu depuis son icône.</span></div>
</div>

<div id="rotate" class="layer"><b>📱</b>Tourne ton téléphone en paysage</div>
<button id="fs" type="button" hidden>Plein écran</button>

<script>
// Les gros fichiers sont publiés compressés et découpés : on les recolle ici avant que Godot ne les lise.
(function () {
  const PARTS = {
    'index.wasm': { parts: ['g/engine.gz.wasm'], type: 'application/wasm' },
    'index.pck': { parts: ['g/game0.gz.wasm', 'g/game1.gz.wasm', 'g/game2.gz.wasm', 'g/game3.gz.wasm', 'g/game4.gz.wasm'], type: 'application/octet-stream' },
  };
  const cache = {};
  const realFetch = window.fetch.bind(window);
  async function assemble(name) {
    const spec = PARTS[name];
    const blobs = [];
    for (const p of spec.parts) {
      const r = await realFetch(p);
      if (!r.ok) throw new Error('Fichier manquant : ' + p + ' (' + r.status + ')');
      blobs.push(await r.blob());
    }
    const gz = new Blob(blobs).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(gz).blob();
  }
  window.__sopPreload = function (name) { return cache[name] || (cache[name] = assemble(name)); };
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const clean = url.split('?')[0].split('#')[0];
    for (const name in PARTS) {
      if (clean === name || clean.endsWith('/' + name)) {
        return window.__sopPreload(name).then((b) => new Response(b, { status: 200, headers: { 'Content-Type': PARTS[name].type, 'Content-Length': String(b.size) } }));
      }
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="g/engine.js"></script>
<script>
(function () {
  const boot = document.getElementById('boot');
  const bar = document.querySelector('#bar i');
  const msg = document.getElementById('msg');
  const play = document.getElementById('play');
  const fs = document.getElementById('fs');
  const SIZES = { wasm: 43699190, pck: 44328080 };

  function fail(text) { msg.textContent = text; bar.parentNode.hidden = true; play.hidden = true; }

  if (typeof DecompressionStream === 'undefined') { fail('Ce navigateur est trop ancien. Mets à jour iOS (16.4 ou plus) puis réessaie.'); return; }
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail('Il manque : ' + missing.join(', ')); return; }

  // Téléchargement dès l'ouverture, pendant que le joueur lit l'écran.
  let done = 0;
  const step = (n) => (b) => { done += n; bar.style.width = Math.round(done * 100) + '%'; return b; };
  Promise.all([__sopPreload('index.wasm').then(step(0.7)), __sopPreload('index.pck').then(step(0.3))]).then(() => {
    bar.style.width = '100%';
    msg.textContent = 'Prêt.';
    play.hidden = false;
  }, (e) => fail('Le chargement a échoué : ' + e.message));

  const engine = new Engine({
    args: [], canvasResizePolicy: 2, executable: 'index', experimentalVK: false, focusCanvas: true,
    fileSizes: { 'index.pck': SIZES.pck, 'index.wasm': SIZES.wasm }, gdextensionLibs: [], ensureCrossOriginIsolationHeaders: false,
  });

  const canFs = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function goFullscreen() {
    const el = document.documentElement;
    try {
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      if (p && p.catch) p.catch(() => {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    } catch (e) {}
  }
  fs.addEventListener('click', goFullscreen);

  play.addEventListener('click', () => {
    play.disabled = true;
    msg.textContent = 'Réveil d\'Arkhanor…';
    if (canFs) goFullscreen();
    engine.startGame().then(() => {
      boot.remove();
      // Sur téléphone, le bouton gênerait l'affichage des épées en haut à droite.
      if (canFs && !('ontouchstart' in window)) fs.hidden = false;
      document.getElementById('canvas').focus();
    }, (e) => { console.error(e); fail('Le jeu n\'a pas pu démarrer : ' + (e && e.message ? e.message : e)); });
  });
})();
</script>

<script>if(/iPhone|iPad/.test(navigator.userAgent)&&!navigator.standalone&&!matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches)document.getElementById("a2hs").hidden=false;</script>
